[workspace]
resolver = "2"
members = ["crates/drift-core", "crates/drift-server", "crates/drift-search-plugin", "crates/drift-tracker-sim-plugin", "src-tauri"]

[workspace.package]
version = "0.1.26"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
