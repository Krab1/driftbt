[package]
name = "drift-search-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

# The first-party search sources (Internet Archive, Torznab) as a Drift plugin: one small program, started with the
# source's name as its argument. Must not depend on drift-core (and so not on the torrent engine): it has to stay small.
[[bin]]
name = "drift-search"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "query", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "time", "macros", "net", "io-util"] }
