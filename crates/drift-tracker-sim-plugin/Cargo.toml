[package]
name = "drift-tracker-sim-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

# Simulator plugin for testing a tracker you operate (docs/plugins/tracker-sim-design.md). Like the search plugin it
# must not depend on drift-core, so it carries no torrent engine.
[[bin]]
name = "tracker-sim"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
