[package]
name = "drift-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
drift-core = { path = "../drift-core" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
