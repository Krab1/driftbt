[package]
name = "drift-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Must stay free of tauri / axum / webview crates: see CLAUDE.md rule 2 (checked by scripts/check-core-deps.mjs).
[dependencies]
async-trait = "0.1.92"
librqbit = { version = "=9.0.1", default-features = false, features = ["default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
