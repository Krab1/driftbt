[package]
name = "drift-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Must stay free of tauri / axum / webview crates: see CLAUDE.md rule 2 (checked by scripts/check-core-deps.mjs).
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1.92"
flate2 = "1.1.10"
# http-api-client has no deps; it only exposes the peer-stats filter types we need.
librqbit = { version = "=9.0.1", default-features = false, features = ["default-tls", "http-api-client"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "query", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# Plugin registry: verify the signed index (minisign, the format Drift's own updates use), check each download's SHA-256, decode base64.
minisign-verify = "0.3"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_System_JobObjects", "Win32_Security"] }
