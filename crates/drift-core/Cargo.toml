[package]
name = "drift-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Must stay free of tauri / axum / webview crates: see CLAUDE.md rule 2 (checked by scripts/check-core-deps.mjs).
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1.92"
flate2 = "1.1.10"
# http-api-client has no deps; it only exposes the peer-stats filter types we need.
librqbit = { version = "=9.0.1", default-features = false, features = ["default-tls", "http-api-client"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
